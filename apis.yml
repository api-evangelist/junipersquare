apis:
- name: Juniper Square Developer API
  description: Developer API with broad read and write coverage across the GPX platform — investor data, fund accounting, payments, compliance,
    and reporting. Used to sync investor and fund data into CRMs (Salesforce), push reporting into data warehouses (Snowflake), build custom portals
    or internal tools, and connect ERP/accounting systems. Delivered as a 2-4 week developer-led engagement; no public OpenAPI or self-serve reference
    is published.
