aid: junipersquare

name: Juniper Square

description: Juniper Square is a fund operating system for the private markets, used by 2,300+ general partners across private equity, venture
  capital, commercial real estate, and private credit to raise capital, run fund administration and fund accounting, and manage the LP experience.
  Its GPX platform unifies investor data, fund accounting, payments, compliance, and reporting, and exposes them through a developer API (broad
  read/write coverage delivered as a developer-led engagement), pre-built connectors (HubSpot, Preqin, Outlook, DocuSign, Yardi IM/Voyager, Lob),
  and Headless GPX — an MCP server that brings the platform to any MCP-compatible AI client (Claude, Copilot, ChatGPT, Gemini) with authentication,
  permissions, and audit inherited from the customer's existing configuration.

